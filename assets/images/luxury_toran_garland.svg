<svg xmlns="http://www.w3.org/2000/svg" width="44" height="190" viewBox="0 0 44 190">
  <defs>
    <!-- Sacred Kalawa / Zari Thread -->
    <linearGradient id="gThread" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFEAA7"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#966F1E"/>
    </linearGradient>

    <!-- Rich Mango Leaf (Left Shaded / Right Sunlit) -->
    <linearGradient id="gLeafL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#236343"/>
      <stop offset="50%" stop-color="#184A31"/>
      <stop offset="100%" stop-color="#0C2D1C"/>
    </linearGradient>
    <linearGradient id="gLeafR" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#389366"/>
      <stop offset="50%" stop-color="#2B7651"/>
      <stop offset="100%" stop-color="#16442C"/>
    </linearGradient>

    <!-- Antique Brass Ghungroo Bead -->
    <radialGradient id="gGhungroo" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFF9D6"/>
      <stop offset="40%" stop-color="#E5C158"/>
      <stop offset="80%" stop-color="#B38A22"/>
      <stop offset="100%" stop-color="#5C430B"/>
    </radialGradient>

    <!-- Fragrant Mogra (Jasmine) Bud -->
    <radialGradient id="gMogra" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F4EFE6"/>
      <stop offset="100%" stop-color="#D5CCA8"/>
    </radialGradient>

    <!-- Saffron-Orange Fluffy Marigold Radial -->
    <radialGradient id="gMarigoldO" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="25%" stop-color="#F97316"/>
      <stop offset="65%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#9A3412"/>
    </radialGradient>

    <!-- Golden-Yellow Fluffy Marigold Radial -->
    <radialGradient id="gMarigoldY" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="25%" stop-color="#FBBF24"/>
      <stop offset="65%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#854D0E"/>
    </radialGradient>
  </defs>

